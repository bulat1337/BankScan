interface:
  display_name: "Bank Balance Bridge"
  short_description: "Use bankscan to wait for login, keep the same run alive through authorization, scan balances and credit-card details for Alfa, VTB, and T-Bank, and close bridge Chrome"
  default_prompt: "Use $bank-balance-bridge with bankscan or the bundled CLI to open the persistent bridge profiles for Alfa, VTB, and T-Bank, wait for login when needed, keep the same bankscan run alive until authorization completes instead of asking for a follow-up message, scan balances and credit-card details, and close bridge Chrome at the end. For repo changes, keep one local feature branch per worktree under /Users/bulatmotygullin/Documents/BankScan/worktrees inside the same top-level BankScan folder, do not create a sibling folder like ~/Documents/BankScan-worktrees, do not push feature branches, and ask before merging into main."

policy:
  allow_implicit_invocation: true
